[package]
name = "cashew"
version = "0.0.11"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
once_cell = "1"
tokio = { version = "1", features = ["rt", "time"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
